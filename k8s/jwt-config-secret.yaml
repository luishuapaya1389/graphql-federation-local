# k8s/jwt-config-secret.yaml
# IMPORTANTE: Este archivo es solo la estructura.
# Los valores reales se crean con kubectl create secret (nunca en Git)
apiVersion: v1
kind: Secret
metadata:
  name: jwt-config
  namespace: apollo
  annotations:
    description: "URLs de JWKS y issuers de los 3 authorization servers"
type: Opaque
# Los valores se crean via CLI — no hardcodear aquí
# kubectl create secret generic jwt-config --from-literal=...